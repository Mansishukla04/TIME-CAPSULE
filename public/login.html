<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TIME CAPSULE - Login</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="logo">🕰️</div>
    <h1>TIME CAPSULE</h1>
    <p class="subtitle">Your personal memory vault</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required autofocus>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn-login">Enter Vault</button>
      <p id="errorMsg" class="error"></p>
      <p style="margin-top: 16px; font-size: 13px; color: #9d174d;">
       
      </p>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (data.success) {
          window.location.href = '/dashboard.html';
        } else {
          errorMsg.textContent = data.message || 'Wrong email or password';
        }
      } catch (err) {
        errorMsg.textContent = 'Something went wrong. Try again.';
      }
    });
  </script>
</body>
</html>
